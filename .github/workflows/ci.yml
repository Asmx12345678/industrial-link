name: CI
on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build gateway and plugin
        run: make -j2
      - name: End-to-end tests
        run: make test
      - name: Python syntax check
        run: python -m compileall adapters simulator tests

